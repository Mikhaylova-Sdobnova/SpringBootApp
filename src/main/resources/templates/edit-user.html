<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit user</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<form th:action="@{/admin/edit}" th:object="${user}" method="POST">
    <label>
        <input name="id" th:field="*{id}" th:value="${user.id}" hidden="hidden">
    </label>
    <label for="name">First Name</label>
    <input type="text" id="name" th:field="*{name}" th:value="${user.name}" required>
    <div style="color: red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
    </br>
    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" th:field="*{lastName}" th:value="${user.lastName}" required>
    <div style="color: red" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Name error</div>
    </br>
    <label for="age">Age</label>
    <input type="text" id="age" th:field="*{age}" th:value="${user.age}" required>
    <div style="color: red" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Name error</div>
    </br>
    <label for="username">Email</label>
    <input type="text" id="username" th:field="*{username}" th:value="${user.username}" required>
    <div style="color: red" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Name error</div>
    </br>
    <label>
        <input name="password" th:field="*{password}" th:value="${user.password}" hidden="hidden">
    </label>
    </br>
    <label for="roles">Role</label>
    <select class="form-select" id="roles" name="authorities" required multiple>
        <option th:each="role : ${allRoles}"
                        th:text="${role.toString()}"
                th:value="${role.id}"></option>
    </select>
    </br>
    </br>
    <button type="submit">Edit</button>
</form>
<form th:action="@{/logout}" method="post">
    <input type="submit" value="Logout" />
</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
