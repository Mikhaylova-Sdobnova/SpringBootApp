<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit user</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="card" style="margin-right: 25px; margin-left: 25px;">
    <h5 class="card-header">Edit user</h5>
    <div class="card-body">
        <div class="row justify-content-center">
            <div class="col-3" style="text-align: center;">
<form th:action="@{/admin/edit}" th:object="${user}" method="POST">
    <div class="mb-3">
        <label for="id" class="form-label"><strong>ID</strong></label>
        <input class="form-control form-control-sm" id="id" th:field="*{id}" th:value="${user.id}" disabled>
        <input name="id" th:field="*{id}" th:value="${user.id}" hidden="hidden">
    </div>
    <div class="mb-3">
        <label for="name" class="form-label"><strong>First Name</strong></label>
    <input type="text" class="form-control form-control-sm" id="name" th:field="*{name}" th:value="${user.name}" required>
    <div style="color: red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
    </div>
    <div class="mb-3">
        <label for="lastName" class="form-label"><strong>Last Name</strong></label>
    <input type="text" id="lastName" class="form-control form-control-sm" th:field="*{lastName}" th:value="${user.lastName}" required>
    <div style="color: red" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Name error</div>
    </div>
    <div class="mb-3">
        <label for="age" class="form-label"><strong>Age</strong></label>
    <input type="number" min="0" max="120" id="age" class="form-control form-control-sm" th:field="*{age}" th:value="${user.age}" required>
    <div style="color: red" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Name error</div>
    </div>
    <div class="mb-3">
        <label for="username" class="form-label"><strong>Email</strong></label>
    <input type="email" id="username" class="form-control form-control-sm" th:field="*{username}" th:value="${user.username}" required>
    <div style="color: red" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Name error</div>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label"><strong>Password</strong></label>
        <input type="password" class="form-control form-control-sm" id="password" th:field="*{password}" th:value="${user.password}" readonly>
       <input name="password" th:field="*{password}" th:value="${user.password}" hidden="hidden">
    </div>
    <div class="mb-3">
        <label for="roles" class="form-label"><strong>Role</strong></label>
    <select class="form-select" size="2" id="roles" name="authorities" required multiple>
        <option th:each="role : ${allRoles}"
                        th:text="${role.toString()}"
                th:value="${role.id}"></option>
    </select>
    </div>
    <button type="submit">Edit</button>
</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
            </div>
        </div>
    </div>
</div>
</body>
</html>
