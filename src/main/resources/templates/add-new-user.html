<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add new user</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<nav class="navbar bg-dark">
    <div style="margin-left: 20px;" class="text-white"><b><span th:text="${admin.username}"></span></b> with roles: <span
            th:each="role : ${admin.roles}" th:text="${role.toString()}"></span></div>
    <div>
        <a class="nav-link text-white-50" style="margin-right: 20px;" th:href="@{/logout}">Logout</a>
    </div>
</nav>
<div class="row g-0" style="height: 100vh;">
    <div class="row g-0" style="height: 100vh;">
        <div class="col-2">
            <nav class="nav nav-pills flex-column" style="margin-top: 10px;">
                <a class="flex-sm-fill text-sm-left nav-link active" aria-current="page" href="/admin">Admin</a>
                <a class="flex-sm-fill text-sm-left nav-link" href="/user">User</a>
            </nav>
        </div>
        <div class="col-10" style="background-color: #f8fcff;">
            <h1 style="margin-left: 25px; margin-top: 10px;">Admin panel</h1>
            <ul class="nav nav-tabs" style="margin-left: 25px; margin-right: 25px;">
                <li class="nav-item">
                    <a class="nav-link" href="/admin">Users table</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/admin/new">New users</a>
                </li>
            </ul>
            <div class="card" style="margin-right: 25px; margin-left: 25px;">
                <h5 class="card-header">Add new user</h5>
                <div class="card-body">
                    <div class="row justify-content-center">
                    <div class="col-4" style="text-align: center;">
<form th:action="@{/admin}" th:object="${user}" method="POST">
    <div class="mb-3">
        <label for="name" class="form-label form-label-sm"><strong>First Name</strong></label>
    <input type="text" class="form-control form-control-sm" id="name" th:field="*{name}" placeholder="First Name" required>
    <div style="color: red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
    </div>
    <div class="mb-3">
        <label for="lastName" class="form-label form-label-sm"><strong>Last Name</strong></label>
    <input type="text" class="form-control form-control-sm" id="lastName" th:field="*{lastName}" placeholder="Last Name" required>
    <div style="color: red" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Name error</div>
    </div>
        <div class="mb-3">
            <label for="age" class="form-label"><strong>Age</strong></label>
    <input type="number" min="0" max="120" class="form-control form-control-sm" id="age" th:field="*{age}" placeholder="Age" required>
    <div style="color: red" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Name error</div>
    </div>
    <div class="mb-3">
        <label for="username" class="form-label"><strong>Email</strong></label>
    <input type="email" class="form-control form-control-sm" id="username" th:field="*{username}" placeholder="Email" required>
    <div style="color: red" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Name error</div>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label"><strong>Password</strong></label>
    <input type="password" class="form-control form-control-sm" id="password" th:field="*{password}" placeholder="Password" required>
    <div style="color: red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Name error</div>
    </div>
    <div class="mb-3">
        <label for="roles" class="form-label"><strong>Roles</strong></label>
    <select class="form-select form-select-sm" size="2" id="roles" name="authorities" required multiple>
        <option th:each="role : ${allRoles}"
                         th:text="${role.toString()}"
                th:value="${role.id}"></option>
    </select>
    </div>
    <button type="submit" class="btn btn-success">Add new user</button>
</form>
</br>
</div>
    </div>
</div>
    </div>
        </div>
</div>
</div>
</body>
</html>
