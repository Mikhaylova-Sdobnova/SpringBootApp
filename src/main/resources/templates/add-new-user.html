<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Add new user</title>
</head>
<body>
<form th:action="@{/admin}" th:object="${user}" method="POST">
    <label for="name">First Name</label>
    <input type="text" id="name" th:field="*{name}" required>
    <div style="color: red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
    </br>
    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" th:field="*{lastName}" required>
    <div style="color: red" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Name error</div>
    </br>
    <label for="age">Age</label>
    <input type="text" id="age" th:field="*{age}" required>
    <div style="color: red" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Name error</div>
    </br>
    <label for="username">Email</label>
    <input type="text" id="username" th:field="*{username}" required>
    <div style="color: red" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Name error</div>
    </br>
    <label for="password">Password</label>
    <input type="text" id="password" th:field="*{password}" required>
    <div style="color: red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Name error</div>
    </br>
    <label for="roles">Roles</label>
    </br>
    <select class="form-select" id="roles" name="authorities" required multiple>
        <option th:each="role : ${allRoles}"
                         th:text="${role.toString()}"
                th:value="${role.id}"></option>
    </select>
    </br>
    <button type="submit">Add new user</button>
</form>
</br>
<form th:action="@{/logout}" method="post">
    <input type="submit" value="Logout" />
</form>
</body>
</html>
