<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div style="background-color: #f8fcff; height: 100vh;">
<div class="row justify-content-center">
<div class="col-3">
    <h3 style="margin-top: 50px;"><strong>Please sign in</strong></h3>
<form th:action="@{/login}" method="post">
    <input type="text" class="form-control" id="username"
           name="username" placeholder="Email address" required />
    <input type="password" class="form-control" id="password"
           name="password" placeholder="Password" required />
    <div class="d-grid">
    <button type="submit" class="btn btn-primary" style="margin-top: 5px;">Sign in</button>
    </div>
</form>
</div>
</div>
</div>
</body>
</html>
