<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<!-- Above navbar -->
<nav class="navbar bg-dark">
    <div style="margin-left: 20px;" class="text-white"><b><span>email</span></b> with roles: <span>roles</span></div>
    <!-- Logout link -->
    <div>
        <a class="nav-link text-white-50" style="margin-right: 20px;" th:href="@{/logout}">Logout</a>
    </div>
</nav>
<div class="row g-0" style="height: 100vh;">
<!-- Fist column with buttons -->
<div class="col-2">
    <nav class="nav nav-pills flex-column" style="margin-top: 10px;">
        <a class="flex-sm-fill text-sm-left nav-link active" aria-current="page" href="#">Admin</a>
        <a class="flex-sm-fill text-sm-left nav-link" href="#">User</a>
    </nav>
</div>
<!--Second column-->
<!-- #adminPanel-->
<div class="col-10" style="background-color: #f8fcff;">
<h1 style="margin-left: 25px; margin-top: 10px;">Admin panel</h1>
<!-- Nav with "add user" button -->
<ul class="nav nav-tabs" style="margin-left: 25px; margin-right: 25px;">
    <li class="nav-item">
        <a class="nav-link active" aria-current="page" href="#">Users table</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="#">New user</a>
    </li>
</ul>
<!-- Users table -->
<div class="card" style="margin-right: 25px; margin-left: 25px;">
    <h5 class="card-header">All users</h5>
    <div class="card-body">
        <table class="table table-striped" id="usersTable">
            <thead class="table-group-divider" style="color: #e9ecef;">
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Role</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody id="tableBody" class="table-group-divider" style="color: #e9ecef;">
            </tbody>
        </table>
        <!-- Edit modal -->
        <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="EditModalLabel">Edit user</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                        </div>
                        <div class="modal-body">
                            <div class="row justify-content-center">
                                <div class="col-6" style="text-align: center;">
                                    <form id="formEdit" action="#" method="POST">
                                    <div class="mb-3">
                                        <label for="editId" class="form-label"><strong>ID</strong></label>
                                        <input class="form-control form-control-sm" type="text" id="editId" name="id" readonly/>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editName" class="form-label"><strong>First Name</strong></label>
                                        <input type="text" class="form-control form-control-sm" id="editName" name="name" placeholder="name"/>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editLastName" class="form-label"><strong>Last Name</strong></label>
                                        <input type="text" id="editLastName" class="form-control form-control-sm" name="lastName" placeholder="lastName"/>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editAge" class="form-label"><strong>Age</strong></label>
                                        <input type="number" min="0" max="120" id="editAge" class="form-control form-control-sm" name="age" placeholder="age"/>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editUsername" class="form-label"><strong>Email</strong></label>
                                        <input type="email" id="editUsername" class="form-control form-control-sm" name="username" placeholder="username"/>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editPassword" class="form-label"><strong>Password</strong></label>
                                        <input type="password" class="form-control form-control-sm" id="editPassword" name="password" placeholder="password" readonly>
                                    </div>
                                        <div class="mb-3">
                                            <label for="editRoles"><b>Role</b></label>
                                            <select multiple size="2"
                                                    class="form-control form-control-sm"
                                                    id="editRoles" name="roles" required>
                                            </select>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer text-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="editClose">Close</button>
                            <button type="submit" class="btn btn-primary">Edit</button>
                        </div>
                    </div>
                </div>
        </div>
    </div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!--<script src="/admin-panel.js"></script>-->
<script> const URLGetUsers = 'http://localhost:8080/api/admin/users'
const rows = document.getElementById('tableBody')
let newRow = ''

function getAllUsers() {
    fetch(URLGetUsers)
        .then((res) => res.json())
        .then((users) => {
            users.map((user) => {
                let rolesString = rolesToString(user.roles);
                return (newRow += `<tr>
                  <td>${user.id}</td>
                  <td>${user.name}</td>
                  <td>${user.lastName}</td>
                  <td>${user.age}</td>
                  <td>${user.username}</td>
                  <td>${rolesString}</td>
                   <td>
                          <button type="button"
                          class="btn btn-primary"
                          data-bs-toogle="modal"
                          data-bs-target="#editModal"
                          onclick="editModal(${user.id})">
                                Edit
                            </button>
                        </td>
                        <td>
                            <button type="button"
                            class="btn btn-danger"
                            data-toggle="modal"
                            data-target="#deleteModal"
                            onclick="deleteModal(${user.id})">
                                Delete
                            </button>
                        </td>
                  </tr>`)
            })
            rows.innerHTML = newRow
        })
        .catch((error) => console.log(error))
}

getAllUsers()

function rolesToString(roles) {
    let rolesString = '';
    for (const role of roles) {
        rolesString += (role.name.replace('ROLE_', '') + ' ');
    }
    return rolesString;
}
</script>
</body>
</html>
