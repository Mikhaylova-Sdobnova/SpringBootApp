<script> const URLUsers = 'http://localhost:8080/api/admin/users'
const rows = document.getElementById('tableBody')
let newRow = ''

function getAllUsers() {
    fetch(URLUsers)
        .then((res) => res.json())
        .then((users) => {
            users.map((user) => {
                let rolesString = rolesToString(user.roles);
                return (newRow += `<tr>
                  <td>${user.id}</td>
                  <td>${user.name}</td>
                  <td>${user.lastName}</td>
                  <td>${user.age}</td>
                  <td>${user.username}</td>
                  <td>${rolesString}</td>
                   <td>
                          <button type="button"
                          class="btn btn-primary"
                          data-bs-toogle="modal"
                          data-bs-target="#editModal"
                          onclick="editModal(${user.id})">
                                Edit
                            </button>
                        </td>
                        <td>
                            <button type="button"
                            class="btn btn-danger"
                            data-bs-toggle="modal"
                            data-bs-target="#deleteModal"
                            onclick="deleteModal(${user.id})">
                                Delete
                            </button>
                        </td>
                  </tr>`)
            })
            rows.innerHTML = newRow
        })
        .catch((error) => console.log(error))
}

getAllUsers()

function rolesToString(roles) {
    let rolesString = ''
    for (const role of roles) {
        rolesString += (role.name.replace('ROLE_', '') + ' ')
    }
    return rolesString;
}

// authenticated user page script
const URLUser = 'http://localhost:8080/api/user'
const authenticatedUser = document.getElementById('UserTableBody')
const authUsername = document.getElementById('adminUsername')
const authRoles = document.getElementById('adminRoles')

function getAuthenticatedUser() {
    fetch(URLUser)
        .then((res) => res.json())
        .then((user) => {
                let rolesString = rolesToString(user.roles);
            authenticatedUser.innerHTML = `<tr>
                  <td>${user.id}</td>
                  <td>${user.name}</td>
                  <td>${user.lastName}</td>
                  <td>${user.age}</td>
                  <td>${user.username}</td>
                  <td>${rolesString}</td>
                  </tr>`
            authUsername.innerHTML = `${user.username}`
            authRoles.innerHTML = `${rolesString}`
            })
        .catch((error) => console.log(error))
}

getAuthenticatedUser()

// edit script
function editModal(id) {
    console.log("Edit Modal");
    const modalEdit = new bootstrap.Modal(document.querySelector('#editModal'));
    modalEdit.toggle()
}

// delete script
let formDelete = document.forms["deleteForm"]

deleteUser()

async function deleteModal(id) {
    console.log("Delete Modal");
    let modalDelete = new bootstrap.Modal(document.querySelector('#deleteModal'));
    await open_fill_modal(formDelete, modalDelete, id);
    loadRolesForDelete()
}

async function open_fill_modal(form, modal, id) {
    const url = `http://localhost:8080/api/admin/users/${id}`;
    try {
        const response = await fetch(url);
        const userData = await response.json();
        console.log("Fetched user data:", userData, form);

        form.id.value = userData.id;
        form.name.value = userData.name;
        form.lastName.value = userData.lastName;
        form.age.value = userData.age;
        form.username.value = userData.username;
        if (form.password) form.password.value = userData.password;
        userData.roles.forEach(role => {
            const roleOption = form.roles.querySelector(`option[value="${role.id}"]`);
            if (roleOption) {
                roleOption.selected = true;
            }
        });
        modal.show();
    } catch (error) {
        console.error("Error fetching user data:", error);
    }
}
function deleteUser(id) {
    fetch('/api/users/' + id, {method: 'DELETE'})
        .then(function (response) {
            modalDelete.modal('hide');
            if (response.status === 404 || response.status === 400) {
                response.text().then((value) => console.warn("Error message: " + value));
                return;
            }
            // usersTableId.find('#userRow\\[' + id + '\\]').remove();
            // console.info("User with id = " + id + " was deleted");
        });
}
function loadRolesForDelete() {
    let selectDelete = document.getElementById("delete-roles");
    selectDelete.innerHTML = "";

    fetch("http://localhost:8080/api/admin/roles")
        .then(res => res.json())
        .then(data => {
            data.forEach(role => {
                let option = document.createElement("option");
                option.value = role.id;
                option.text = role.name.replace('ROLE_', '');
                selectDelete.appendChild(option);
            });
        })
}

window.addEventListener("load", loadRolesForDelete);

// add new user script
let formNewUser = document.forms["formNewUser"]
let selectAdd = document.getElementById("new-roles");
const addedName = document.getElementById("new-name")
const addedLastName = document.getElementById("new-lastName")
const addedAge = document.getElementById("new-age")
const addedUsername = document.getElementById("new-username")
const addedPassword = document.getElementById("new-password")
const addButton = document.getElementById("addBtn")


function addUser(name, lastName, age, username, password) {

    let addedRoles = []
    for (let i = 0; i < formNewUser.roles.options.length; i++) {
        if (formNewUser.roles.options[i].selected)
            addedRoles.push({
                id: formNewUser.roles.options[i].value,
                role: "ROLE_" + formNewUser.roles.options[i].text
            });
    }
    fetch(URLUsers, {
        method: "POST",
        body: JSON.stringify({
            name: name,
            lastName: lastName,
            age: age,
            username: username,
            password: password,
            roles: addedRoles,
        }),
        headers: {
            "Content-Type": "application/json",
        },
    })
        .then((res) => {
            if (res.ok) {
                console.log("User added")
                addedName.value = ''
                addedLastName.value = ''
                addedAge.value = ''
                addedUsername.value = ''
                addedPassword.value = ''
                selectAdd.selectedIndex = -1
                return res.json()
            } else {
                throw new Error("Failed to add")
            }
        })
        .then((user) => {
            const addedRow = `<tr>
                  <td>${user.id}</td>
                  <td>${user.name}</td>
                  <td>${user.lastName}</td>
                  <td>${user.age}</td>
                  <td>${user.username}</td>
                  <td>${addedRoles}</td>
                   <td>
                          <button type="button"
                          class="btn btn-primary"
                          data-bs-toogle="modal"
                          data-bs-target="#editModal"
                          onclick="editModal(${user.id})">
                                Edit
                            </button>
                        </td>
                        <td>
                            <button type="button"
                            class="btn btn-danger"
                            data-toggle="modal"
                            data-target="#deleteModal"
                            onclick="deleteModal(${user.id})">
                                Delete
                            </button>
                        </td>
                  </tr>`
            rows.insertAdjacentHTML("afterbegin", addedRow)

        })
        .catch((error) => console.log(error))
}

function newUserRoles() {
    selectAdd.innerHTML = "";

    fetch("http://localhost:8080/api/admin/roles")
        .then(res => res.json())
        .then(data => {
            data.forEach(role => {
                let option = document.createElement("option");
                option.value = role.id;
                option.text = role.name.replace('ROLE_', '')
                selectAdd.appendChild(option);
            });
        })
}
window.addEventListener("load", newUserRoles)

addButton.addEventListener("click", (e) => {
    e.preventDefault()
    const newName = addedName.value
    const newLastName = addedLastName.value
    const newAge = addedAge.value
    const newUsername = addedUsername.value
    const newPassword = addedPassword.value

    addUser(newName, newLastName, newAge, newUsername, newPassword)
})
</script>
