<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<nav class="navbar bg-dark">
    <div style="margin-left: 20px;" class="text-white"><b><span th:text="${admin.username}"></span></b> with roles: <span
            th:each="role : ${admin.roles}" th:text="${role.toString()}"></span></div>
    <div>
        <a class="nav-link text-white-50" style="margin-right: 20px;" th:href="@{/logout}">Logout</a>
    </div>
</nav>
<div class="row g-0" style="height: 100vh;">
    <div class="col-2">
        <nav class="nav nav-pills flex-column" style="margin-top: 10px;">
            <a class="flex-sm-fill text-sm-left nav-link active" aria-current="page" href="/admin">Admin</a>
            <a class="flex-sm-fill text-sm-left nav-link" href="/user">User</a>
        </nav>
    </div>
    <div class="col-10" style="background-color: #f8fcff;">
        <h1 style="margin-left: 25px; margin-top: 10px;">Admin panel</h1>
        <ul class="nav nav-tabs" style="margin-left: 25px; margin-right: 25px;">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/admin">Users table</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/admin/new">New users</a>
            </li>
        </ul>
        <div class="card" style="margin-right: 25px; margin-left: 25px;">
            <h5 class="card-header">All users</h5>
            <div class="card-body">
<table class="table table-striped">
    <thead class="table-group-divider" style="color: #e9ecef;">
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Age</th>
        <th>Email</th>
        <th>Role</th>
        <th>Edit</th>
        <th>Delete</th>
    </tr>
    </thead>
    <tbody class="table-group-divider" style="color: #e9ecef;">
    <tr var="user" items="${users}">
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.name}"></td>
        <td th:text="${user.lastName}"></td>
        <td th:text="${user.age}"></td>
        <td th:text="${user.username}"></td>
        <td>
            <span th:each="role : ${user.roles}" th:text="${role.toString()}"></span>
        </td>
        <td>
            <form th:action="@{/admin/edit}">
                <button type="submit" class="btn btn-primary" th:name="id" th:value="${user.id}">Edit</button>
            </form>
        </td>
        <td>
            <form method="post" th:action="@{/admin/delete}">
                <button type="submit" class="btn btn-danger" th:name="id" th:value="${user.id}">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</div>
</div>
    </div>
</div>
</body>
</html>
